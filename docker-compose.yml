version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: breakmyapi-postgres
    environment:
      POSTGRES_DB: breakmyapi
      POSTGRES_USER: breakmyapi
      POSTGRES_PASSWORD: breakmyapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakmyapi -d breakmyapi"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: breakmyapi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: breakmyapi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: breakmyapi
      RABBITMQ_DEFAULT_PASS: breakmyapi
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
